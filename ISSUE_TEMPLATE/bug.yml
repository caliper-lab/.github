name: Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: don't report them here, see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, app version, brand/client affected.
  - type: input
    id: jira
    attributes:
      label: Jira key
      placeholder: EA-123
